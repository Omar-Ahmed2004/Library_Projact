<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Library System{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        input, select {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

<nav>

    <a href="{% url 'book_list' %}">
        Library
    </a>

    <a href="{% url 'dashboard' %}">
        Dashboard
    </a>

    <a href="{% url 'my_loans' %}">
        My Loans
    </a>
    {% if user.groups.all.0.name == "Librarian" %}
            
        <a href="{% url 'add_book' %}">
            Add Book 
        </a>

    {% endif %}

    {% if user.is_authenticated %}
        <span style="color:white;">
            Welcome, {{ user.username }}
        </span>

        <a href="{% url 'logout' %}">
            Logout
        </a>
    {% endif %}


</nav>

<div class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="card">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
